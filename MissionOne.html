<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <!-- tells browser which character set to use, in this case all that UTF-8 contains  -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- viewport refers to browser window or device etc., makes page fit width of device screen -->

        <title>T.HARVEY PORTFOLIO</title> 
        <!-- shows on tab only -->
        <link rel="stylesheet" href="MissionOne.css">
       <!-- connecting to main file's CSS -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
        <!-- Loads the Font Awesome icon library -->

        <link rel="stylesheet" href="contact.css">
        <!-- links the FORM css to my main html -->
    </head>
    <body>
    
        <header class="header">
            
            <button>Change 🎨</button>
            <!-- Need a button for color theme change -->
            <a href="contact.html">Email</a>
        <!-- a tag links main html file to the form html file-->
            <a href="#">About</a>
            <a href="#">Collection of Hats</a>
            <!-- the # is a placeholder for until other web pages done that the links take to -->
            
        </header>
        
        <main class="main-content">
            <!-- section for main content -->
            <h1 id="center-title">Tiina Harvey</h1>
            <div id="blurb">A Wearer of Many Hats.</div>
            <!-- div tag used when no other semantic tag fits -->
            <div class="icon-box">
                <!-- created an invisible container box for logo's to keep them beside each other-->
                <a href="https://www.linkedin.com/" target="_blank" aria-label="LinkedIn"> 
                    <!-- target="blank" opens a new tab instead of fully leaving my website -->
                    <i class="fa-brands fa-linkedin fa-2x fa-spin"></i></a>
                    <!-- the i tag is for my icons -->
                    <!-- fa -2x is styling -->
                <a href="https:www.github.com" target="_blank" aria-label="Github">
                    <i class="fa-brands fa-github fa-2x fa-bounce"></i></a>
                
            </div>
        
        </main>
        
    </body>
        
</html>
